<svg viewBox="0 0 500 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reverse osmosis: a pressure larger than the osmotic pressure on the sea-water side pushes water through the membrane to the fresh-water side; the salts stay behind."><rect x="40" y="70" width="420" height="190" fill="none" stroke="currentColor" stroke-width="2"/><line x1="250" y1="70" x2="250" y2="260" class="tm-acc" stroke-width="3" stroke-dasharray="7 5"/><rect x="42" y="110" width="206" height="148" class="tm-soft"/><rect x="252" y="110" width="206" height="148" fill="none"/><rect x="44" y="96" width="202" height="12" class="tm-mutedf"/><line x1="145" y1="22" x2="145" y2="86" stroke="currentColor" stroke-width="4"/><path d="M133 74 L145 90 L157 74" fill="none" stroke="currentColor" stroke-width="4"/><text x="170" y="46" font-size="13">pressure larger than π</text><path d="M205 190 L300 190" class="tm-acc" stroke-width="4"/><path d="M288 180 L304 190 L288 200" fill="none" class="tm-acc" stroke-width="4"/><text x="300" y="176" font-size="12">water</text><text x="145" y="284" text-anchor="middle" font-size="13">sea water (solution)</text><text x="355" y="284" text-anchor="middle" font-size="13">fresh water (solvent)</text><text x="250" y="304" text-anchor="middle" font-size="12">semipermeable membrane, e.g. cellulose acetate</text><circle cx="80.3" cy="243.5" r="4" class="tm-mutedf"/><circle cx="179.0" cy="198.5" r="4" class="tm-mutedf"/><circle cx="112.7" cy="133.5" r="4" class="tm-mutedf"/><circle cx="57.6" cy="245.1" r="4" class="tm-mutedf"/><circle cx="86.3" cy="211.6" r="4" class="tm-mutedf"/><circle cx="89.0" cy="227.1" r="4" class="tm-mutedf"/><circle cx="137.9" cy="158.1" r="4" class="tm-mutedf"/><circle cx="61.9" cy="149.7" r="4" class="tm-mutedf"/><circle cx="132.5" cy="230.8" r="4" class="tm-mutedf"/><circle cx="184.1" cy="146.5" r="4" class="tm-mutedf"/><circle cx="77.4" cy="167.9" r="4" class="tm-mutedf"/><circle cx="134.4" cy="137.1" r="4" class="tm-mutedf"/><circle cx