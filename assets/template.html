<style>
/* Layout: a quiet study app. Compact sticky bar (chapter + five sections + search), a restrained
   topic sidebar beside a ~68ch reading column on desktop, a labelled topic menu on phones.
   Theme: deliberately single - white page with the student's logo colours: yellow #FFC531 and
   near-black #15171C. Yellow is only ever a fill (with dark text on it); text, lines and focus rings
   that must be read use the darker amber or the ink, so contrast stays above WCAG AA. */
:root {
  --accent-base: #FFC531;
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F7F5EF;
  --ink: #15171C;
  --muted: #5C5A55;
  --line: #E7E3D8;
  --accent: var(--accent-base);
  --accent-soft: #FFF5D6;
  --accent-ink: #7A5800;
  --accent-strong: #9A6E00;
  --on-accent: #15171C;
  --mark: #FFE3A0;
  --mark-ink: #3B2F00;
  --good: #1B7A46;
  --good-soft: #E4F4EA;
  --bad: #B3361E;
  --bad-soft: #FBE9E4;
  --warn: #8F5B00;
  --warn-soft: #FFF3D9;
  --info-soft: #EEF2FD;
  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
  --tap: 44px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.22; text-wrap: balance; margin: 0; color: var(--ink); }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 6px; box-shadow: 0 0 0 6px var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.muted { color: var(--muted); }
.nw { white-space: nowrap; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 .15em; border-radius: 3px; box-shadow: inset 0 -2px 0 var(--accent-strong); }
math { font-size: 1.06em; }
math[display="block"] { overflow-x: auto; overflow-y: hidden; padding: .3em 0; max-width: 100%; }
.mathbox { overflow-x: auto; max-width: 100%; display: block; }
.tm-tex { font-family: var(--f-mono); font-size: .85em; background: var(--surface-2); padding: 0 .3em; border-radius: 4px; }
.tm-tex.bad { color: var(--bad); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in oklab, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 10px 16px; padding-block: 8px; flex-wrap: wrap; }
.brandrow { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; color: var(--ink); }
.brandrow .logo { flex: none; }
@media (max-width: 420px) { .brand span { display: none; } .brandrow .logo { width: 28px; height: 28px; } }
.brand { display: grid; line-height: 1.15; min-width: 0; }
.brand b { font-family: var(--f-display); font-size: 19px; }
.brand span { font-size: 12.5px; color: var(--muted); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { min-height: var(--tap); padding: 0 14px; border: 0; background: none; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
.iconbtn { min-height: var(--tap); min-width: var(--tap); padding: 0 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.iconbtn:hover { border-color: var(--accent-strong); }
@media (max-width: 720px) {
  .bar .wrap { gap: 6px 10px; }
  .nav { order: 3; width: 100%; }
  .nav button { padding: 0 11px; font-size: 14.5px; }
}

main { padding-block: 22px 96px; min-height: 60vh; }
main:focus { outline: none; }
.view { display: grid; gap: 20px; }
.h2 { font-size: 26px; letter-spacing: -.01em; }
.lead { color: var(--muted); max-width: 68ch; }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 18px 20px; min-width: 0; }
.card.soft { background: var(--surface-2); border-color: transparent; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.label { font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.btn { min-height: var(--tap); padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; text-align: left; }
.btn:hover { border-color: var(--accent-strong); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent-strong); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent-ink); }
.btn.small { min-height: 40px; font-size: 14px; padding: 0 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.empty { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.notice { border-radius: 8px; padding: 10px 14px; font-size: 14.5px; background: var(--info-soft); }
.notice.warn { background: var(--warn-soft); }
.notice.bad { background: var(--bad-soft); }

/* learn home */
.continue { display: grid; gap: 10px; padding: 22px; border-radius: 14px; background: var(--accent-soft); }
.continue h2 { font-size: 24px; }
.map { display: grid; gap: 12px; }
.map-topic { border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.map-topic h3 { font-size: 18px; }
.map-lessons { display: grid; gap: 4px; list-style: none; padding: 0; margin: 0; }
.map-lessons button { width: 100%; min-height: var(--tap); text-align: left; border: 0; background: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; font-size: 15.5px; }
.map-lessons button:hover { background: var(--surface-2); }
.tick { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.tick.done { color: var(--good); font-weight: 600; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 600; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent-ink); }

/* lesson layout */
.learn { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; align-items: start; }
.side { position: sticky; top: 76px; display: grid; gap: 2px; font-size: 14px; }
.side .t { font-weight: 700; color: var(--muted); font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; padding: 12px 8px 4px; }
.side button { border: 0; background: none; text-align: left; padding: 7px 8px; border-radius: 6px; cursor: pointer; color: var(--muted); display: grid; grid-template-columns: 34px 1fr; gap: 4px; line-height: 1.3; min-height: 44px; align-items: center; }
.side button:hover { background: var(--surface-2); color: var(--ink); }
.side button[aria-current="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.topicbtn { display: none !important; }
@media (max-width: 900px) {
  .learn { grid-template-columns: minmax(0, 1fr); }
  .learn > .side { display: none; }
  .topicbtn { display: inline-flex !important; }
}
.reader { max-width: 56ch; display: grid; gap: 18px; font-family: var(--f-body); font-size: 19px; line-height: 1.7; min-width: 0; }
@media (max-width: 480px) { .reader { font-size: 18px; } }
.reader h1 { font-size: 32px; letter-spacing: -.015em; }
.reader h3 { font-size: 22px; margin-top: 10px; }
.reader h4 { font-size: 19px; margin-top: 6px; }
.reader ul, .reader ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.reader .ui, .reader .q, .reader .widget, .reader .worked, .reader .lessonfoot { font-family: var(--f-ui); }
.objective { border-left: 4px solid var(--accent); padding: 4px 0 4px 14px; font-family: var(--f-ui); font-size: 16.5px; }
.objective b { display: block; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-ink); }
.formula { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; background: var(--surface); min-width: 0; }
.formula .fname { font-family: var(--f-ui); font-weight: 700; font-size: 15px; }
.formula .ftype { font-family: var(--f-ui); font-size: 12.5px; }
.symbols { font-family: var(--f-ui); font-size: 15px; border-collapse: collapse; width: 100%; }
.symbols td { padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--line); }
.symbols td:first-child { white-space: nowrap; width: 1%; }
.cond { font-family: var(--f-ui); font-size: 15px; color: var(--muted); }
.callout { border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; font-size: 17.5px; background: var(--surface-2); }
.callout .ct { font-family: var(--f-ui); font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.callout.tip, .callout.exam { background: var(--accent-soft); } .callout.tip .ct, .callout.exam .ct { color: var(--accent-ink); }
.callout.mistake, .callout.warning { background: var(--bad-soft); } .callout.mistake .ct, .callout.warning .ct { color: var(--bad); }
.callout.remember, .callout.mnemonic, .callout.notation { background: var(--surface-2); border-left: 4px solid var(--accent); } .callout.remember .ct, .callout.mnemonic .ct, .callout.notation .ct { color: var(--accent-ink); }
.callout.why, .callout.real, .callout.ncert { background: var(--info-soft); }
.callout.beyond { background: none; border: 1px dashed var(--line); }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; font-family: var(--f-ui); }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 700; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
caption { caption-side: top; font-size: 14px; font-weight: 700; color: var(--ink); padding: 10px 12px; text-align: left; }
figure { margin: 0; display: grid; gap: 6px; }
.svgbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; color: var(--ink); background: var(--surface); }
.svgbox svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
figcaption { font-family: var(--f-ui); font-size: 14.5px; color: var(--muted); }
svg .tm-acc { stroke: var(--accent-strong); } svg .tm-accf { fill: var(--accent-strong); } svg .tm-soft { fill: var(--accent-soft); }
svg .tm-muted { stroke: var(--muted); } svg .tm-mutedf { fill: var(--muted); } svg .tm-line { stroke: var(--line); }
svg .tm-bad { stroke: var(--bad); } svg .tm-badf { fill: var(--bad); } svg .tm-good { stroke: var(--good); } svg .tm-goodf { fill: var(--good); }
svg text { fill: currentColor; font-family: var(--f-ui); }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; font-size: 17px; }
.compare > div { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-family: var(--f-ui); }
.flow .node { padding: 6px 10px; border-radius: 6px; background: var(--surface-2); }
.flow .arrow { font-size: 13px; color: var(--accent-ink); text-align: center; padding: 0 4px; }
.flow .arrow::after { content: "→"; display: block; font-size: 18px; }
details.more { border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; font-size: 17.5px; }
details.more > summary { min-height: var(--tap); display: flex; align-items: center; cursor: pointer; font-family: var(--f-ui); font-weight: 600; font-size: 15.5px; color: var(--accent-ink); }
details.more[open] { padding-bottom: 14px; }
details.more > div { display: grid; gap: 12px; }
.recap { border-top: 2px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.lessonfoot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }

/* worked solution */
.worked { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 16.5px; line-height: 1.6; min-width: 0; }
.worked > .wh { padding: 12px 16px; background: var(--surface-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.worked > .wh b { font-size: 16px; }
.worked > .wb { padding: 14px 16px; display: grid; gap: 14px; min-width: 0; }
.wstep { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; }
.wstep > .k { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-ink); padding-top: 3px; }
.wstep ul { padding-left: 1.1em; margin: 0; display: grid; gap: 4px; }
.why { display: block; font-size: 14.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin-top: 4px; }
.why b { color: var(--accent-ink); font-weight: 600; }
.calc { display: grid; gap: 10px; }
.calc > div, .steps > li > div, .wstep > div:last-child, .answer, .hint, .fb, .readout { overflow-x: auto; overflow-y: hidden; min-width: 0; }
@media (max-width: 560px) { .wstep { grid-template-columns: 1fr; gap: 2px; } }
.board { border: 1px dashed var(--accent-strong); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; font-family: var(--f-ui); font-size: 16px; }
.steps { counter-reset: s; list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 8px !important; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.steps > li::before { content: counter(s); font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); text-align: right; }
.steps .m { font-family: var(--f-mono); font-size: 12.5px; color: var(--accent-ink); white-space: nowrap; }
.answer { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-weight: 600; font-family: var(--f-ui); }

/* questions */
.qlist { display: grid; gap: 16px; }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; background: var(--surface); font-size: 16.5px; min-width: 0; }
.q .q { border-style: dashed; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; }
.qmeta .src { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.qmeta .sp { flex: 1; }
.role { font-weight: 700; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); }
.qtext { font-family: var(--f-body); font-size: 18px; line-height: 1.65; }
.passage { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-family: var(--f-body); font-size: 17px; }
.opts { display: grid; gap: 8px; }
.opt { min-height: var(--tap); text-align: left; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16.5px; }
.opt:hover:not([disabled]) { border-color: var(--accent-strong); }
.opt .k { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--accent-soft); }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.ok .k::after { content: " ✓"; color: var(--good); } .opt.no .k::after { content: " ✗"; color: var(--bad); }
.opt[disabled] { cursor: default; }
.ar { display: grid; gap: 6px; font-family: var(--f-body); font-size: 17.5px; }
.qactions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hintbox { display: grid; gap: 6px; justify-items: start; }
.hint { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; font-size: 15.5px; justify-self: stretch; }
.hint b { color: var(--warn); }
.ansform { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.ansrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.field { display: grid; gap: 4px; font-size: 14px; font-weight: 600; min-width: 0; max-width: 100%; }
.view > *, .qlist > * { min-width: 0; }
.reader > *, .reader li, .q > *, .q li, .widget > *, .wb > *, .formula > *, .card > *, .card li, .opt > *, .callout > *, .callout li, figure > *, .compare > *, details.more > div > *, .recap > *, .recap li, .wstep > *, .calc > *, .board > *, .steps > li > *, .hintbox > *, .fb > *, .sol > *, .sol li, .fc > *, .result > *, .sol > *, .sol > * > *, .rubric > *, .rubric label > *, .board > *, .ansform > *, .opts > *, .ar > *, .grid2 > *, .continue > *, .map > *, .sheet > * { min-width: 0; }
.sol .chip { white-space: normal; }
.field select { min-width: 0; width: auto; max-width: 100%; text-overflow: ellipsis; }
.field input[type=file] { width: 100%; min-width: 0; font-size: 14px; }
.field input, .field select, textarea.draft { min-height: var(--tap); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--surface); font-weight: 400; font-size: 16px; max-width: 100%; }
.field input.num { width: 11em; } .field input.unit { width: 9em; }
textarea.draft { width: 100%; min-height: 90px; font-family: var(--f-body); resize: vertical; }
.fb { border-radius: 8px; padding: 10px 12px; font-size: 15.5px; display: grid; gap: 4px; }
.fb.ok { background: var(--good-soft); } .fb.no { background: var(--bad-soft); } .fb.info { background: var(--info-soft); }
.fb b { font-weight: 700; }
.sol { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 12px; }
.rubric { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.rubric label { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: start; min-height: 36px; cursor: pointer; }
.rubric input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; }
.status { font-size: 12.5px; }
.ordiv { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.ordiv::before, .ordiv::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.filters .field select { min-width: 150px; }

/* flashcards */
.fc { display: grid; gap: 14px; justify-items: center; }
.cardbtn { width: min(640px, 100%); min-height: 240px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 26px; display: grid; align-content: center; justify-items: center; gap: 10px; text-align: center; font-family: var(--f-body); font-size: 20px; cursor: pointer; }

  var bk = el("section", "card"); bk.innerHTML = '<h3>Where your progress is stored</h3><p id="storage-note2" style="margin-top:6px"></p><p class="muted" style="margin-top:6px">Browsers can clear saved data (private windows, "clear site data", low storage). Make a backup now and then.</p>';
  var row = el("div", "row"); row.style.marginTop = "10px";

function exportBackup() {

/* ------------------------------------------------------------- overlays */

}

/* ---------------------------------------------------------------- search */
var IDX = null;
var STOP = { why: 1, by: 1, the: 1, a: 1, an: 1, of: 1, to: 1, is: 1, do: 1, we: 1, i: 1, how: 1, what: 1, "in": 1, and: 1, "for": 1, does: 1, are: 1, it: 1, on: 1, with: 1 };
function js(x) { return JSON.stringify(x || "", function (k, v) { return k.charAt(0) === "_" || k === "svg" || k === "figure" ? undefined : v; }); }
function buildIndex() {
  IDX = [];
  function add(label, kind, text, target) { IDX.push({ label: label, kind: kind, text: plain(text).toLowerCase(), target: target }); }
  LESSONS.concat(PREUNITS).forEach(function (l) {
    add(l.title, (l._prereq ? "Refresher " : "Lesson ") + l._no, l.title + " " + (l.objective || ""), { lesson: l.id });
    (l.blocks || []).forEach(function (b, i) {
      var label = b.type === "worked" ? "Worked example: " + (b.title || "") : b.type === "formula" ? "Formula: " + (b.label || "") : b.type === "h" ? b.text : b.title || (b.text ? String(b.text).slice(0, 90) : l.title);
      var txt = js(b);
      add(label, (l._prereq ? "Refresher " : "Lesson ") + l._no, txt, { lesson: l.id, block: "b-" + l.id + "-" + i });
    });
  });
  Object.keys(ALLQ).forEach(function (id) { var q = ALLQ[id]; if (q._parent) return; var ref = q.source ? [q.source.ref, q.source.set, q.source.year, q.source.q ? "Q" + q.source.q : ""].join(" ") : ""; add((q.q || q.assertion || q.passage || "").slice(0, 120), (TYPE_LABEL[q.type] || "Question") + (srcLine(q) ? " · " + plain(srcLine(q)).slice(0, 60) : ""), [q.q, q.passage, q.assertion, q.reason, ref, js(q.teach), js(q.solution), js(q.parts)].join(" "), { q: id }); });
  (D.formulas || []).forEach(function (f) { add(f.name, "Formula", f.name + " " + (f.where || "") + " " + f.tex, { ref: "formulas" }); });
  (D.terms || []).forEach(function (t) { add(t.term, "Glossary", t.term + " " + t.def, { ref: "glossary" }); });
  CARDS.forEach(function (c) { add(c.front, "Flashcard", c.front + " " + c.back, { card: c.id }); });
}
var BACK = null, chip = null;
function remember() { BACK = { view: CUR.view, arg: CUR.arg, y: window.scrollY }; }
function goBack() { var b = BACK; BACK = null; hideBackChip(); if (!b) return; go(b.view, b.arg, { keepScroll: true, noFocus: true }); setTimeout(function () { window.scrollTo(0, b.y); }, 90); }
function showBackChip() { if (!BACK) return; if (chip) chip.remove(); chip = btn("← Back to where you were", "pri backchip", goBack); document.body.appendChild(chip); }
function hideBackChip(soft) { if (chip && !soft) { chip.remove(); chip = null; } else if (chip && soft) { var c = chip; chip = null; setTimeout(function () { if (!chip) c.remove(); else c.remove(); }, 0); } }
function openSearch() {

    s.appendChild(el("h2", "h2", "Search this chapter"));
    var lab = el("label", "sr", "Search terms"); lab.setAttribute("for", "srch"); s.appendChild(lab);
    var inp = el("input"); inp.type = "search"; inp.id = "srch"; inp.placeholder = "e.g. molality, why divide by 40, Exercise 1.12, 56/4/1"; s.appendChild(inp);
    var res = el("div", "qlist"); res.setAttribute("aria-live", "polite"); s.appendChild(res);
    var t;

        res.innerHTML = "";

        var hits = IDX.map(function (e) { var sc = 0; for (var i = 0; i < words.length; i++) { if (e.text.indexOf(words[i]) < 0) return null; sc += 1; if (plain(e.label).toLowerCase().indexOf(words[i]) >= 0) sc += 2; } if (e.target.block) sc += 0.5; return [sc, e]; }).filter(Boolean).sort(function (a, b) { return b[0] - a[0]; }).slice(0, 30);
        if (!hits.length) { res.appendChild(el("div", "empty", "No matches. Try one shorter word.")); return; }
        res.appendChild(el("p", "muted", hits.length + (hits.length === 30 ? "+" : "") + " results"));
        hits.forEach(function (h) {
          var e = h[1]; var b = el("button", "result", '<span class="label">' + esc(e.kind) + "</span><span>" + rich(e.label) + "</span>"); b.type = "button";

}
